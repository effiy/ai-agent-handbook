name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q pyyaml
          python3 -c "
          import os, re, sys, yaml
          errors = []
          REQUIRED = ['title','tags','category','created','updated','source','type','status']
          skipped = 0; checked = 0
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if not d.startswith('.') and d != 'node_modules']
              for f in files:
                  if not f.endswith('.md'): continue
                  fp = os.path.join(root, f)
                  with open(fp, encoding='utf-8', errors='replace') as fh: head = fh.read(2048)
                  m = re.match(r'^---\s*\n(.*?)\n---', head, re.DOTALL)
                  if not m: skipped += 1; continue
                  checked += 1
                  try:
                      fm = yaml.safe_load(m.group(1))
                      if not isinstance(fm, dict): errors.append(f'{fp}: not a YAML mapping'); continue
                      for field in REQUIRED:
                          if field not in fm: errors.append(f'{fp}: missing \"{field}\"')
                  except yaml.YAMLError as e: errors.append(f'{fp}: YAML error — {e}')
          print(f'Checked {checked}, skipped {skipped} without frontmatter')
          if errors:
              for e in errors: print(f'  ❌ {e}')
              sys.exit(1)
          print('✅ All frontmatter valid')
          "